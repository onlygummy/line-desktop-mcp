[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "line-desktop-mcp"
dynamic = ["version"]
description = "MCP server for LINE Desktop automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "onlygummy" },
]
dependencies = [
  "fastmcp>=4.0,<5",
  "line-ext-msg==2.0",
]

[project.scripts]
line-desktop-mcp = "line_desktop_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/onlygummy/line-desktop-mcp"
Repository = "https://github.com/onlygummy/line-desktop-mcp"
Issues = "https://github.com/onlygummy/line-desktop-mcp/issues"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/line_desktop_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/line_desktop_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/line_desktop_mcp"]
ignore_missing_imports = true
